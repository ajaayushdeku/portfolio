<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="2048_game_style.css" />
  </head>
  <body>
    <section class="game-wrapper">
      <header class="game-header">
        <div>
          <h1 class="title">2048</h1>

          <p>Arrow Key ⬆,⬅,⬇,➡ to move tiles</p>
        </div>

        <div class="score-box">
          <div class="score">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="score">
            <span>Best</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </header>

      <div class="board-container">
        <div class="board">
          <!-- 4x4 grid cells generated by JS -->
        </div>
      </div>

      <div class="controls">
        <div class="control-grid">
          <span></span>
          <button id="upArrow">⬆</button>
          <span></span>
          <button id="leftArrow">⬅</button>
          <button id="downArrow">⬇</button>
          <button id="rightArrow">➡</button>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn primary play-btn">Play</button>
        <button class="btn replay-btn">New Game</button>
      </div>
    </section>

    <script src="2048_game_script.js"></script>
  </body>
</html>
